[project]
name = "beelinebench"
version = "1.0.0"
description = "How efficiently do decision models navigate multi-step problems?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "rich>=13.7",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
# `python -m beelinebench plot`.
plot = ["matplotlib>=3.8"]
# Clef and Clef-flash, served locally by examples/clef.py. The versions are those of the model cards.
clef = ["torch>=2.11", "transformers>=5.10.2", "huggingface_hub>=0.30", "safetensors>=0.4", "pillow>=10"]

[project.scripts]
beelinebench = "beelinebench.__main__:main"

[dependency-groups]
dev = ["pytest>=8.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
